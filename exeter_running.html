        <p>This map shows some of my favourite running routes around Exeter, including paved paths, roads, and unpaved trails. I created the map from GPS tracks recorded on my runs, using <a href="https://umap.openstreetmap.fr/en/">uMap</a> and OpenStreetMap data.</p>
